[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crptochat"
version = "1.0.0"
description = "Chat de terminal cifrado ponta a ponta, com servidor cego e arquivos P2P"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=42", "textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crptochat = "crptochat.cli:main"
crptochat-server = "crptochat.server:main"
crptochat-dash = "crptochat.dash:main"
crptochat-admin = "crptochat.admin:main"

[tool.setuptools]
packages = ["crptochat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B404: importing subprocess is fine; every call is reviewed and marked (no shell anywhere).
# B110: the try/except/pass blocks are best-effort cleanup (closing sockets, wiping temp files).
skips = ["B404", "B110"]
exclude_dirs = ["tests"]
