# Security checks: static analysis, dependencies, secrets, the server image and
# protocol fuzzing. Runs on every push / PR and weekly (new CVEs appear even
# when the code does not change).
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bandit
        run: |
          pip install -q "bandit[toml]>=1.8"
          # config in pyproject.toml; every exception is marked "# nosec <id>" with a reason next to it
          bandit -q -c pyproject.toml -r crptochat
      - name: Semgrep (regras python e secrets)
        run: |
          pip install -q semgrep
          semgrep scan --config p/python --config p/secrets --severity ERROR --error --metrics=off \
            crptochat packaging .github

  dependencies:
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install -q --upgrade pip
          /tmp/audit/bin/pip install -q . pip-audit
          # audits what the project actually installs (crptochat itself is not on PyPI: skipped)
          /tmp/audit/bin/pip-audit --skip-editable --progress-spinner off

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --exit-code 1

  image:
    name: Imagem do servidor (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t crptochat-server:scan .
      - name: A imagem continua funcionando (sem pip)
        run: |
          docker run --rm --entrypoint python crptochat-server:scan -c "import crptochat.server, cryptography"
          ! docker run --rm --entrypoint sh crptochat-server:scan -c "command -v pip"
      - name: Instalar o Trivy (repositório apt oficial da Aqua, assinado)
        run: |
          set -euo pipefail
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Trivy na imagem
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress crptochat-server:scan

  fuzz:
    name: Fuzzing do protocolo (servidor e cliente)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q -e ".[dev]"
      - name: Campanha longa (10x a da suíte normal)
        env:
          CRPTOCHAT_FUZZ_SCALE: "10"
        run: pytest -q tests/test_fuzz.py
