name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # ffmpeg: real Opus encoder and voice masking. pass + gnupg: real vault tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pass gnupg
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m crptochat.selftest
